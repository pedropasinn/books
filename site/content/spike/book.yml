title: After the Spike
authors: Dean Spears, Michael Geruso
language: pt-BR
summary: |
  Sobre o despovoamento global no horizonte e por que estabilizar a
  população — não reduzi-la — pode ser a escolha mais importante deste
  século. Dean Spears e Michael Geruso destrincham a tese, o argumento
  moral, e o que falta saber pra dar conta da virada.
